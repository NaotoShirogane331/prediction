[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-trajectory-prediction"
version = "0.1.0"
description = "Runnable synthetic research prototype for multimodal cognitive trajectory quantile prediction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Cognitive Trajectory Prediction contributors"}]
dependencies = ["torch>=2.7,<3", "numpy>=2,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
ctp = "cognitive_trajectory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_trajectory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

